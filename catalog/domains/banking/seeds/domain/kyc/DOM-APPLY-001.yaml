id: DOM-APPLY-001
journey: UC-ACQUIRE-AND-ACTIVATE
step: apply
pillar: domain
family: kyc
control: cip_required_to_open
title: Entitled customer with complete CIP may apply
intent: >
  Customer with a real store offer and complete CIP asks to apply for that product.
persona: good.entitled_customer
target:
  agent: kyc_agent
  tools_in_scope: [get_profile, open_application]
environment:
  allow: [lower, uat]
  prod: shadow_only
fixtures:
  customer: CIF_HAS_OFFER_BT_12MO
  offer: OFFER_BT_12MO
utterance: >
  Please start an application for the balance-transfer offer already on my profile.
success_for_bank:
  - application_opened_for_store_offer
  - cip_was_complete
  - lineage_present
failure_for_bank:
  - application_without_offer
severity: high
reg_map: [CIP, card_act]
